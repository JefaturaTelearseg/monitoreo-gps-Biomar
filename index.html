<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoreo GPS BioMar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EEF2F4; --surface:#FFFFFF; --surface-alt:#E6ECF0; --surface-raised:#FFFFFF;
    --border:#D3DCE2; --border-strong:#B7C3CC;
    --text:#0B141D; --text-secondary:#48586A; --text-muted:#7E8DA0;
    --accent:#0A7EA8; --accent-strong:#075E7D; --accent-soft:#E1F1F6; --accent-ink:#FFFFFF;
    --good:#5C9A28; --good-soft:#EAF5DC;
    --warn:#B5790E; --warn-soft:#FBF0DD;
    --critical:#C1443B; --critical-soft:#FBE7E4;
    --shadow: 0 1px 2px rgba(11,20,29,0.06), 0 8px 24px -12px rgba(11,20,29,0.18);
    --radius: 10px;
    --masthead-1:#040a17; --masthead-2:#0b2b49; --masthead-text:#E8F2F7; --masthead-muted:#9FB4C6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#05070C; --surface:#0B121C; --surface-alt:#121B28; --surface-raised:#131C29;
      --border:#1E2A3A; --border-strong:#2C3D50;
      --text:#E8EEF3; --text-secondary:#C9D2DC; --text-muted:#8A94A3;
      --accent:#4FD1E8; --accent-strong:#8FE6F5; --accent-soft:#0E2A30; --accent-ink:#06141C;
      --good:#8ED84B; --good-soft:#1F2E12;
      --warn:#E0A73E; --warn-soft:#34290F;
      --critical:#E06A5E; --critical-soft:#35191A;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#05070C; --surface:#0B121C; --surface-alt:#121B28; --surface-raised:#131C29;
    --border:#1E2A3A; --border-strong:#2C3D50;
    --text:#E8EEF3; --text-secondary:#C9D2DC; --text-muted:#8A94A3;
    --accent:#4FD1E8; --accent-strong:#8FE6F5; --accent-soft:#0E2A30; --accent-ink:#06141C;
    --good:#8ED84B; --good-soft:#1F2E12;
    --warn:#E0A73E; --warn-soft:#34290F;
    --critical:#E06A5E; --critical-soft:#35191A;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    font-size:14px; line-height:1.5;
    position:relative;
  }
  .watermark{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(70vw, 760px); height:auto;
    opacity:0.16; filter:blur(0.5px) saturate(1.3);
    pointer-events:none; z-index:0; user-select:none;
  }
  .masthead, .wrap{ position:relative; z-index:1; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  h1,h2,h3{ font-family:"Montserrat", system-ui, sans-serif; text-wrap:balance; margin:0; }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 20px 56px; }

  .masthead{
    background: linear-gradient(100deg, var(--masthead-1) 0%, var(--masthead-2) 100%);
    margin-bottom:22px;
  }
  .masthead-inner{
    max-width:1180px; margin:0 auto; padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .masthead-left{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .tel-logo{ height:72px; width:auto; display:block; }
  .masthead-divider{ width:1px; height:32px; background:rgba(255,255,255,0.16); }
  .brand-eyebrow{
    font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--masthead-muted);
    font-weight:600; margin-bottom:3px;
  }
  .brand-title{ font-size:21px; font-weight:700; color:var(--masthead-text); font-family:"Montserrat",sans-serif; }
  .masthead-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .client-badge{
    display:flex; align-items:center; gap:8px; background:#FFFFFF; border-radius:8px;
    padding:5px 12px 5px 10px; box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .client-badge .biomar-logo{ height:28px; width:auto; display:block; border-radius:5px; }
  .client-badge-label{ font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:#7E8DA0; font-weight:700; border-right:1px solid #E1E6EA; padding-right:8px; margin-right:2px; }

  .brand-sub{ font-size:13px; color:var(--text-secondary); margin:16px 0 20px; }
  .brand-sub b{ color:var(--text); font-weight:600; }

  .btn{
    display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    font-family:"IBM Plex Sans", sans-serif; font-size:13px; font-weight:600;
    padding:10px 16px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text); white-space:nowrap; text-decoration:none;
    transition:background .15s ease, border-color .15s ease, transform .05s ease;
  }
  .btn:hover{ background:var(--surface-alt); }
  .btn:active{ transform:translateY(1px); }
  .btn-accent{ background:#4FD1E8; border-color:#4FD1E8; color:#06141C; }
  .btn-accent:hover{ background:#8FE6F5; border-color:#8FE6F5; }
  .btn-ghost{ background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.25); color:var(--masthead-text); }
  .btn-ghost:hover{ background:rgba(255,255,255,0.16); }
  .btn-icon{ font-size:15px; line-height:1; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }

  .btn-doc{
    display:flex; align-items:center; gap:10px; cursor:pointer; text-decoration:none;
    padding:7px 16px 7px 9px; border-radius:10px; font-family:inherit;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.16);
    transition:background .15s ease, border-color .15s ease, transform .08s ease;
    -webkit-appearance:none; appearance:none;
  }
  .btn-doc:hover{ background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.3); transform:translateY(-1px); }
  .btn-doc:active{ transform:translateY(0); }
  .btn-doc-icon{
    width:34px; height:34px; border-radius:8px; flex-shrink:0;
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .btn-doc-icon svg{ width:18px; height:18px; display:block; }
  .btn-doc-text{ display:flex; flex-direction:column; gap:1px; text-align:left; line-height:1.15; }
  .btn-doc-title{ font-size:12.5px; font-weight:700; color:var(--masthead-text); }
  .btn-doc-sub{ font-size:9.5px; letter-spacing:0.07em; text-transform:uppercase; color:var(--masthead-muted); font-weight:600; }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
  .kpi-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .kpi-label{ font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); font-weight:600; }
  .kpi-value{ font-family:"Montserrat", sans-serif; font-size:28px; font-weight:700; margin-top:6px; color:var(--text); }
  .kpi-value .unit{ font-size:14px; font-weight:500; color:var(--text-secondary); margin-left:4px; }
  .kpi-foot{ font-size:12px; color:var(--text-muted); margin-top:4px; }
  .kpi-foot.warn{ color:var(--warn); }
  .kpi-foot.critical{ color:var(--critical); }

  .filters{
    display:flex; flex-direction:column; gap:12px; margin-bottom:20px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .filter-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .filter-title{ font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); font-weight:600; width:78px; flex-shrink:0; }
  .chip-group{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    padding:7px 12px; border-radius:999px; border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text-secondary); font-size:12.5px; font-weight:600;
    font-family:"IBM Plex Mono", monospace;
    transition:all .12s ease;
  }
  .chip:hover{ border-color:var(--accent); color:var(--text); }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .chip .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dot-good{ background:var(--good); } .dot-warn{ background:var(--warn); } .dot-critical{ background:var(--critical); }
  .chip.active .dot{ background:var(--accent-ink); opacity:.85; }
  .chip.disabled{ opacity:.35; cursor:not-allowed; }
  .chip.disabled:hover{ border-color:var(--border-strong); color:var(--text-secondary); }
  .unit-counter{ font-size:11.5px; color:var(--text-muted); font-family:"IBM Plex Mono", monospace; margin-left:2px; }

  select.day-select{
    font-family:"IBM Plex Mono", monospace; font-size:12.5px; font-weight:600;
    padding:7px 10px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text); cursor:pointer;
  }
  select.day-select:hover{ border-color:var(--accent); }

  .tabs{ display:flex; gap:4px; }
  .tab{
    cursor:pointer; padding:8px 14px; border-radius:7px; font-size:13px; font-weight:600;
    color:var(--text-secondary); border:1px solid transparent;
  }
  .tab:hover{ color:var(--text); background:var(--surface-alt); }
  .tab.active{ background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent); }

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px; margin-bottom:16px;
  }
  .panel-title{ font-size:16px; font-weight:700; margin-bottom:2px; }
  .panel-sub{ font-size:12.5px; color:var(--text-muted); margin-bottom:16px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{
    text-align:left; font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--text-muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border-strong);
    white-space:nowrap;
  }
  td{ padding:9px 10px; border-bottom:1px solid var(--border); color:var(--text-secondary); white-space:nowrap; }
  tr.row-selected td{ background:var(--accent-soft); color:var(--text); }
  tr:hover td{ background:var(--surface-alt); }
  .table-scroll{ overflow-x:auto; max-height:560px; overflow-y:auto; }
  td.num, th.num{ text-align:right; font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums; }
  td.plate{ font-family:"IBM Plex Mono", monospace; font-weight:600; color:var(--text); }

  .loc-text{ color:var(--text-secondary); white-space:normal; max-width:260px; overflow:hidden; text-overflow:ellipsis; }

  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
    padding:3px 9px; border-radius:999px;
  }
  .pill-good{ background:var(--good-soft); color:var(--good); }
  .pill-warn{ background:var(--warn-soft); color:var(--warn); }
  .pill-critical{ background:var(--critical-soft); color:var(--critical); }
  .pill .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .rank-row{ display:grid; grid-template-columns:96px 1fr 76px; align-items:center; gap:10px; padding:7px 0; }
  .rank-plate{ font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:12.5px; }
  .rank-track{ position:relative; height:20px; background:var(--surface-alt); border-radius:5px; overflow:hidden; }
  .rank-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:5px; background:var(--accent); }
  .rank-fill.is-zero{ background:var(--border-strong); width:6px !important; }
  .rank-val{ text-align:right; font-family:"IBM Plex Mono", monospace; font-size:12.5px; color:var(--text-secondary); }

  .barchart-wrap{ overflow-x:auto; }
  .barchart{ display:block; }
  .bar-rect{ fill:var(--accent); }
  .bar-rect.zero{ fill:var(--border-strong); }
  .bar-rect:hover{ fill:var(--accent-strong); }
  .axis-line{ stroke:var(--border); stroke-width:1; }
  .axis-text{ fill:var(--text-muted); font-family:"IBM Plex Mono", monospace; font-size:10px; }
  .chart-tooltip{
    position:absolute; pointer-events:none; background:var(--text); color:var(--bg);
    font-family:"IBM Plex Mono", monospace; font-size:11.5px; padding:7px 10px; border-radius:6px;
    box-shadow:var(--shadow); white-space:nowrap; opacity:0; transform:translate(-50%,-100%);
    transition:opacity .08s ease; z-index:5; line-height:1.5;
  }
  .chart-tooltip.show{ opacity:1; }
  .chart-tooltip .tt-title{ font-weight:600; color:var(--bg); }
  .chart-tooltip .tt-row{ opacity:.85; }

  .sm-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; }
  .sm-card{ border:1px solid var(--border); border-radius:8px; padding:12px; background:var(--surface-alt); cursor:pointer; transition:border-color .12s ease; }
  .sm-card:hover{ border-color:var(--accent); }
  .sm-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .sm-plate{ font-family:"IBM Plex Mono", monospace; font-weight:700; font-size:13px; }
  .sm-total{ font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:var(--text-muted); }
  .sm-conductor{ font-size:11.5px; color:var(--text-muted); margin-top:6px; }

  .empty-note{
    display:flex; align-items:flex-start; gap:10px; padding:14px 16px; border-radius:8px;
    background:var(--surface-alt); color:var(--text-secondary); font-size:13px; margin-bottom:14px;
  }
  .empty-note ul{ margin:6px 0 0; padding-left:18px; }

  .legend-row{ display:flex; gap:18px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); }
  .legend-swatch{ width:12px; height:12px; border-radius:3px; }

  .sync-badge{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--good); flex-shrink:0; }
  .sync-dot.stale{ background:var(--warn); }

  footer{ text-align:center; color:var(--text-muted); font-size:12px; padding-top:8px; }
  footer a{ color:var(--accent-strong); }

  /* POE modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(5,8,12,0.62); display:none;
    align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:var(--surface); border-radius:12px; width:100%; max-width:920px; height:88vh;
    display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.4); overflow:hidden;
    border:1px solid var(--border);
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .modal-head-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .modal-head-icon{ width:32px; height:32px; border-radius:8px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .modal-head-icon svg{ width:17px; height:17px; color:var(--accent-strong); }
  .modal-head-text .modal-title{ font-size:15px; font-weight:700; }
  .modal-head-text .modal-sub{ font-size:11.5px; color:var(--text-muted); }
  .modal-close{ cursor:pointer; border:none; background:none; font-size:22px; color:var(--text-muted); padding:4px 10px; border-radius:6px; flex-shrink:0; }
  .modal-close:hover{ background:var(--surface-alt); color:var(--text); }
  .modal-body{ flex:1; overflow-y:auto; padding:20px 24px 28px; }
  .modal-body.pdf-body{ padding:0; overflow:hidden; }
  .modal-body.pdf-body iframe{ width:100%; height:100%; border:none; background:#525659; }
  .modal-body h4{ font-size:13.5px; font-weight:700; margin:22px 0 4px; color:var(--text); }
  .modal-body h4:first-child{ margin-top:0; }
  .modal-body p.lead{ font-size:12.5px; color:var(--text-secondary); margin:2px 0 0; }
  .modal-body .code-row{ display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted); margin:6px 0 18px; }
  .modal-body .code-row b{ color:var(--text-secondary); font-weight:600; }

  .risk-row{ display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
  .risk-row:last-child{ border-bottom:none; }
  .risk-row .risk-body{ flex:1; font-size:12.5px; color:var(--text-secondary); }
  .risk-row .risk-body b{ color:var(--text); }

  .poe-steps{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .poe-step{ border:1px solid var(--border); border-radius:9px; padding:12px 14px; background:var(--surface-alt); }
  .poe-step-title{ font-size:12.5px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:6px; }
  .poe-step-title .check{ color:var(--good); }
  .poe-step-sub{ font-size:12px; color:var(--accent-strong); font-weight:600; margin:1px 0 8px; }
  .poe-step dl{ margin:0; font-size:11.5px; }
  .poe-step dt{ display:inline; font-weight:600; color:var(--text-muted); }
  .poe-step dd{ display:inline; margin:0 0 0 4px; color:var(--text-secondary); }
  .poe-step .field{ margin-bottom:4px; }

  .scenario-table td{ white-space:normal; }
  .scenario-table td:first-child{ font-weight:600; color:var(--text); white-space:nowrap; }

  @media (max-width: 860px){
    .poe-steps{ grid-template-columns:1fr; }
    .kpi-row{ grid-template-columns:repeat(2,1fr); }
    .sm-grid{ grid-template-columns:repeat(2,1fr); }
    .filter-title{ width:auto; }
    .rank-row{ grid-template-columns:76px 1fr 64px; }
  }
</style>

n_final":null},{"fecha":"2026-09-02","km":0,"movimiento":false,"hora_inicio":null,"hora_fin":null,"km_inicial":43419.4,"km_final":43419.4,"ciudad_inicial":"GUAYAQUIL","ciudad_final":"GUAYAQUIL","ubicacion_inicial":null,"ubicacion_final":null},{"fecha":"2026-09-03","km":0,"movimiento":false,"hora_inicio":null,"hora_fin":null,"km_inicial":43419.4,"km_final":43419.4,"ciudad_inicial":"GUAYAQUIL","ciudad_final":"GUAYAQUIL","ubicacion_inicial":null,"ubicacion_final":null},{"fecha":"2026-09-04","km":5.3,"movimiento":true,"hora_inicio":"2026/09/04 21:20:34","hora_fin":"2026/09/04 22:23:41","km_inicial":43419.4,"km_final":43424.7,"ciudad_inicial":"GUAYAQUIL","ciudad_final":"GUAYAQUIL","ubicacion_inicial":"GUAYAQUIL, CALLE A, a 20 m de URBANIZACION PORTAL AL SOL","ubicacion_final":"Dentro de GUAYAQUIL, a 230 m de IDE BUSINEES SCHOOL"},{"fecha":"2026-09-05","km":57.6,"movimiento":true,"hora_inicio":"2026/09/05 01:52:40","hora_fin":"2026/09/05 18:20:51","km_inicial":43424.7,"km_final":43482.3,"ciudad_inicial":"GUAYAQUIL","ciudad_final":"LA CIENEGA","ubicacion_inicial":"Dentro de GUAYAQUIL, a 230 m de IDE BUSINEES SCHOOL","ubicacion_final":"Dentro de la provincia de GUAYAS. Cerca de la autopista E40 (LA CIENEGA- GUAYAS)"},{"fecha":"2026-09-06","km":0,"movimiento":false,"hora_inicio":null,"hora_fin":null,"km_inicial":43482.3,"km_final":43482.3,"ciudad_inicial":"GUAYAQUIL","ciudad_final":"GUAYAQUIL","ubicacion_inicial":"GUAYAQUIL, CALLE A, a 20 m de URBANIZACION PORTAL AL SOL","ubicacion_final":"GUAYAQUIL, CALLE A, a 20 m de URBANIZACION PORTAL AL SOL"},{"fecha":"2026-09-07","km":17.2,"movimiento":true,"hora_inicio":"2026/09/07 07:32:01","hora_fin":"2026/09/07 19:23:36","km_inicial":43482.3,"km_final":43499.5,"ciudad_inicial":"GUAYAQUIL","ciudad_final":"GUAYAQUIL","ubicacion_inicial":"GUAYAQUIL, CALLE A, a 20 m de URBANIZACION PORTAL AL SOL","ubicacion_final":"GUAYAQUIL, CALLE OLMOS y CALLE PINOS"},{"fecha":"2026-09-08","km":27.9,"movimiento":true,"hora_inicio":"2026/09/08 07:51:18","hora_fin":"2026/09/08 22:17:59","km_inicial":43499.5,"km_final":43527.4,"ciudad_inicial":"GUAYAQUIL","ciudad_final":"GUAYAQUIL","ubicacion_inicial":"GUAYAQUIL, CALLE A, a 20 m de URBANIZACION PORTAL AL SOL","ubicacion_final":"GUAYAQUIL, CALLE A, a 20 m de URBANIZACION PORTAL AL SOL"}]}]}</script>

<script>
(function(){
  const SEED = JSON.parse(document.getElementById('app-data').textContent);
  let DATA = SEED;

  const DOW = ['dom','lun','mar','mié','jue','vie','sáb'];
  const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function fmtDate(iso){
    const d = new Date(iso+'T00:00:00');
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  }
  function dowOf(iso){ return DOW[new Date(iso+'T00:00:00').getDay()]; }
  function fmtNum(n, dec){ return Number(n||0).toLocaleString('es-EC',{minimumFractionDigits:dec||0, maximumFractionDigits:dec||0}); }
  function fmtDateLong(iso){
    const d = new Date(iso+'T00:00:00');
    return `${dowOf(iso)} ${d.getDate()} de ${MESES_LARGO[d.getMonth()]} ${d.getFullYear()}`;
  }
  function monthKey(iso){ return iso.slice(0,7); }
  function monthLabel(mk){
    const [y,m] = mk.split('-');
    return `${MESES[parseInt(m,10)-1].toUpperCase()} ${y}`;
  }
  function fmtHora(dt){
    if(!dt) return '—';
    const t = dt.split(' ')[1];
    return t ? t.slice(0,5) : '—';
  }

  function statusOf(u){
    if(u.dias_con_movimiento === 0) return 'critical';
    if(u.dias_con_movimiento < 10) return 'warn';
    return 'good';
  }
  function statusLabel(s){ return s==='good'?'Activa': s==='warn' ? 'Baja actividad':'Sin actividad'; }

  // ---------- state ----------
  function computeAllMonths(fechas){
    const fromData = new Set(fechas.map(monthKey));
    const year = fechas.length ? fechas[0].slice(0,4) : String(new Date().getFullYear());
    for(let m=6; m<=12; m++){ fromData.add(`${year}-${String(m).padStart(2,'0')}`); }
    return [...fromData].sort();
  }
  const allMonths = computeAllMonths(DATA.meta.fechas);
  const MAX_UNITS = 5;
  let state = { units: [], month: 'ALL', day: 'ALL', tab: 'resumen' };

  function scopeDates(){
    if(state.day !== 'ALL') return [state.day];
    if(state.month !== 'ALL') return DATA.meta.fechas.filter(f=>monthKey(f)===state.month);
    return DATA.meta.fechas;
  }
  function unitDiasInScope(u){
    const s = new Set(scopeDates());
    return u.dias.filter(d=>s.has(d.fecha));
  }
  function scopedUnits(){
    return state.units.length===0 ? DATA.unidades : DATA.unidades.filter(u=>state.units.includes(u.placa));
  }
  function unitScopedStats(u){
    const dias = unitDiasInScope(u);
    const km = dias.reduce((a,d)=>a+(d.km||0),0);
    const diasMov = dias.filter(d=>d.movimiento).length;
    return { km: Math.round(km*10)/10, diasMov, diasTotal: dias.length, dias };
  }

  // ---------- KPIs ----------
  function renderKPIs(){
    const units = scopedUnits();
    const dates = scopeDates();
    let kmTotal = 0, activas=0, sinActividad=0, bajaActividad=0;
    units.forEach(u=>{
      const st = unitScopedStats(u);
      kmTotal += st.km;
      if(st.diasMov===0) sinActividad++;
      else if(st.diasMov < Math.max(3, Math.round(dates.length*0.3))) bajaActividad++;
      else activas++;
    });
    const promedioUnidadDia = units.length && dates.length ? kmTotal/(units.length*dates.length) : 0;
    const tiles = [
      { label:'Km recorridos', value: fmtNum(kmTotal,1), unit:'km', foot: dates.length===1? fmtDateLong(dates[0]) : `${dates.length} días en el periodo` , cls:'' },
      { label:'Unidades activas', value: `${activas}`, unit:`/ ${units.length}`, foot: 'con actividad regular', cls:'' },
      { label:'Baja actividad / sin datos', value: `${bajaActividad + sinActividad}`, unit:'', foot: sinActividad? `${sinActividad} sin ningún viaje` : 'todas con movimiento', cls: sinActividad? 'critical': (bajaActividad? 'warn':'') },
      { label:'Promedio km/unidad/día', value: fmtNum(promedioUnidadDia,1), unit:'km', foot:'sobre el periodo filtrado', cls:'' },
    ];
    document.getElementById('kpi-row').innerHTML = tiles.map(t=>`
      <div class="kpi-tile">
        <div class="kpi-label">${t.label}</div>
        <div class="kpi-value">${t.value}<span class="unit">${t.unit}</span></div>
        <div class="kpi-foot ${t.cls}">${t.foot}</div>
      </div>`).join('');
  }

  // ---------- filters UI ----------
  function renderChips(){
    const all = `<div class="chip ${state.units.length===0?'active':''}" data-unit="ALL">TODAS</div>`;
    const chips = DATA.unidades.map(u=>{
      const s = statusOf(u);
      const active = state.units.includes(u.placa);
      const disabled = !active && state.units.length>=MAX_UNITS;
      return `<div class="chip ${active?'active':''} ${disabled?'disabled':''}" data-unit="${u.placa}"><span class="dot dot-${s}"></span>${u.placa}</div>`;
    }).join('');
    document.getElementById('unit-chips').innerHTML = all + chips;
    const counter = document.getElementById('unit-counter');
    if(state.units.length>0){ counter.textContent = `${state.units.length}/${MAX_UNITS} seleccionadas`; counter.hidden = false; }
    else { counter.hidden = true; }
    document.querySelectorAll('#unit-chips .chip').forEach(el=>{
      el.addEventListener('click', ()=>{
        const placa = el.dataset.unit;
        if(placa==='ALL'){ state.units = []; }
        else if(state.units.includes(placa)){ state.units = state.units.filter(p=>p!==placa); }
        else if(state.units.length < MAX_UNITS){ state.units = [...state.units, placa]; }
        else { return; }
        render();
      });
    });
  }

  function renderMonthChips(){
    const all = `<div class="chip ${state.month==='ALL'?'active':''}" data-month="ALL">TODO</div>`;
    const chips = allMonths.map(mk=>`<div class="chip ${state.month===mk?'active':''}" data-month="${mk}">${monthLabel(mk)}</div>`).join('');
    document.getElementById('month-chips').innerHTML = all + chips;
    document.querySelectorAll('#month-chips .chip').forEach(el=>{
      el.addEventListener('click', ()=>{ state.month = el.dataset.month; state.day='ALL'; render(); });
    });
    renderDaySelect();
  }

  function renderDaySelect(){
    const sel = document.getElementById('day-select');
    const dates = state.month==='ALL' ? DATA.meta.fechas : DATA.meta.fechas.filter(f=>monthKey(f)===state.month);
    let opts = `<option value="ALL">Todos los días${state.month==='ALL'?' (periodo completo)':''}</option>`;
    opts += dates.map(f=>`<option value="${f}" ${state.day===f?'selected':''}>${dowOf(f)} ${fmtDate(f)}</option>`).join('');
    sel.innerHTML = opts;
    sel.value = state.day;
    sel.onchange = ()=>{ state.day = sel.value; render(); };
  }

  const TABS = [ {id:'resumen', label:'Resumen'}, {id:'kilometraje', label:'Kilometraje'}, {id:'detalle', label:'Detalle'} ];
  function renderTabs(){
    document.getElementById('tabs').innerHTML = TABS.map(t=>`<div class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('');
    document.querySelectorAll('#tabs .tab').forEach(el=>{
      el.addEventListener('click', ()=>{ state.tab = el.dataset.tab; render(); });
    });
  }

  // ---------- resumen ----------
  function unitRowHTML(u, selected){
    const s = statusOf(u);
    const st = unitScopedStats(u);
    return `<tr class="${selected?'row-selected':''}" data-unit="${u.placa}">
      <td class="plate">${u.placa}</td>
      <td>${u.conductor}</td>
      <td class="num">${fmtNum(st.km,1)}</td>
      <td class="num">${st.diasMov} / ${st.diasTotal}</td>
      <td><span class="pill pill-${s}"><span class="dot"></span>${statusLabel(s)}</span></td>
    </tr>`;
  }

  function renderResumen(){
    const units = scopedUnits();
    const rows = units.map(u=>unitRowHTML(u, state.units.includes(u.placa))).join('');
    const ranked = [...units].map(u=>({u, km: unitScopedStats(u).km})).sort((a,b)=>b.km-a.km);
    const maxKm = Math.max(...ranked.map(r=>r.km), 1);
    const rankHTML = ranked.map(r=>{
      const pct = Math.max(r.km/maxKm*100, r.km>0?2:0);
      return `<div class="rank-row">
        <div class="rank-plate">${r.u.placa}</div>
        <div class="rank-track"><div class="rank-fill ${r.km===0?'is-zero':''}" style="width:${pct}%"></div></div>
        <div class="rank-val">${fmtNum(r.km,1)} km</div>
      </div>`;
    }).join('');

    return `
      <div class="panel">
        <div class="panel-title">Ranking de kilometraje</div>
        <div class="panel-sub">Unidades ordenadas por km recorridos en el periodo filtrado</div>
        ${rankHTML}
      </div>
      <div class="panel">
        <div class="panel-title">Unidades</div>
        <div class="panel-sub">${units.length} unidad${units.length===1?'':'es'} · periodo filtrado</div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Placa</th><th>Conductor</th><th class="num">Km</th><th class="num">Días con movimiento</th><th>Estado</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }

  // ---------- daily bar chart (dates on x-axis) ----------
  function buildDailyBarChart(dias, opts){
    const w = opts.width || 900, h = opts.height || 220;
    const compact = w < 400;
    const padL = compact ? 30 : 42, padR = 8, padT = 10, padB = compact ? 6 : 26;
    const innerW = w-padL-padR, innerH = h-padT-padB;
    const n = dias.length || 1;
    const maxKm = Math.max(...dias.map(d=>d.km||0), 1);
    const bw = innerW/n;
    const barW = Math.max(bw*0.6, 2);

    let bars = '';
    dias.forEach((d,i)=>{
      const x = padL + i*bw + (bw-barW)/2;
      const barH = Math.max((d.km/maxKm)*innerH, d.movimiento? 2:3);
      const y = padT+innerH-barH;
      bars += `<rect class="bar-rect ${d.km===0?'zero':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="1.5"
        data-fecha="${d.fecha}" data-km="${fmtNum(d.km,1)}" data-hi="${fmtHora(d.hora_inicio)}" data-hf="${fmtHora(d.hora_fin)}"></rect>`;
    });
    const gridVals = compact ? [0, maxKm] : [0, maxKm/2, maxKm];
    let grid = '';
    gridVals.forEach(v=>{
      const y = padT + innerH - (v/maxKm)*innerH;
      grid += `<line class="axis-line" x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}"></line>
        <text class="axis-text" x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${fmtNum(v,0)}</text>`;
    });
    let xlabels='';
    if(!compact){
      const step = Math.max(1, Math.ceil(n/14));
      dias.forEach((d,i)=>{
        if(i%step===0){
          const x = padL + i*bw + bw/2;
          xlabels += `<text class="axis-text" x="${x.toFixed(1)}" y="${h-6}" text-anchor="middle">${fmtDate(d.fecha).slice(0,5)}</text>`;
        }
      });
    }
    return `<svg class="barchart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${grid}${bars}${xlabels}</svg>`;
  }

  function buildUnitCompareChart(units, dateLabel, opts){
    const w = opts.width || 900, h = opts.height || 240;
    const padL = 42, padR = 8, padT = 10, padB = 40;
    const innerW = w-padL-padR, innerH = h-padT-padB;
    const n = units.length || 1;
    const vals = units.map(u=>unitScopedStats(u).km);
    const maxKm = Math.max(...vals, 1);
    const bw = innerW/n;
    const barW = Math.max(bw*0.55, 2);
    let bars = '';
    units.forEach((u,i)=>{
      const km = vals[i];
      const x = padL + i*bw + (bw-barW)/2;
      const barH = Math.max((km/maxKm)*innerH, km>0? 2:3);
      const y = padT+innerH-barH;
      bars += `<rect class="bar-rect ${km===0?'zero':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="1.5"
        data-fecha="${u.placa}" data-km="${fmtNum(km,1)}" data-hi="" data-hf=""></rect>`;
    });
    const gridVals = [0, maxKm/2, maxKm];
    let grid = '';
    gridVals.forEach(v=>{
      const y = padT + innerH - (v/maxKm)*innerH;
      grid += `<line class="axis-line" x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}"></line>
        <text class="axis-text" x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${fmtNum(v,0)}</text>`;
    });
    let xlabels='';
    units.forEach((u,i)=>{
      const x = padL + i*bw + bw/2;
      xlabels += `<text class="axis-text" x="${x.toFixed(1)}" y="${h-26}" text-anchor="middle" transform="rotate(-45 ${x.toFixed(1)} ${h-26})">${u.placa}</text>`;
    });
    return `<svg class="barchart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${grid}${bars}${xlabels}</svg>`;
  }

  function attachBarTooltip(container, isUnitCompare){
    const tip = document.createElement('div');
    tip.className = 'chart-tooltip';
    container.style.position = 'relative';
    container.appendChild(tip);
    container.querySelectorAll('rect.bar-rect').forEach(rect=>{
      rect.addEventListener('mousemove', (e)=>{
        const rectBox = container.getBoundingClientRect();
        const fecha = rect.dataset.fecha, km = rect.dataset.km, hi = rect.dataset.hi, hf = rect.dataset.hf;
        const title = isUnitCompare ? fecha : fmtDate(fecha);
        tip.innerHTML = `<div class="tt-title">${title}</div><div class="tt-row">${km} km</div>${hi?`<div class="tt-row">${hi} – ${hf}</div>`:''}`;
        tip.style.left = (e.clientX - rectBox.left) + 'px';
        tip.style.top = (e.clientY - rectBox.top - 10) + 'px';
        tip.classList.add('show');
      });
      rect.addEventListener('mouseleave', ()=> tip.classList.remove('show'));
    });
  }

  function renderKilometraje(){
    const units = scopedUnits();
    const dates = scopeDates();
    let html = '';
    if(units.length !== 1){
      if(dates.length===1){
        html += `<div class="panel">
          <div class="panel-title">Km por unidad — ${fmtDateLong(dates[0])}</div>
          <div class="panel-sub">Comparativo del día seleccionado</div>
          <div class="barchart-wrap" id="cmp-chart-wrap">${buildUnitCompareChart(units, dates[0], {width:1000,height:260})}</div>
        </div>`;
      } else {
        const cards = units.map(u=>{
          const st = unitScopedStats(u);
          return `<div class="sm-card" data-unit="${u.placa}">
            <div class="sm-head"><span class="sm-plate">${u.placa}</span><span class="sm-total">${fmtNum(st.km,1)} km</span></div>
            ${buildDailyBarChart(st.dias, {width:220, height:90})}
            <div class="sm-conductor">${u.conductor}</div>
          </div>`;
        }).join('');
        html += `<div class="panel">
          <div class="panel-title">Kilometraje diario por unidad</div>
          <div class="panel-sub">Clic en una unidad para ver el detalle</div>
          <div class="sm-grid">${cards}</div>
        </div>`;
      }
    } else {
      const u = units[0];
      const st = unitScopedStats(u);
      html += `<div class="panel">
        <div class="panel-title">${u.placa} · ${u.conductor}</div>
        <div class="panel-sub">${fmtNum(st.km,1)} km en el periodo filtrado · ${st.diasMov} de ${st.diasTotal} días con movimiento</div>
        <div class="barchart-wrap" id="chart-wrap">${dates.length>1 ? buildDailyBarChart(st.dias, {width:1000, height:240}) : '<div class="empty-note">Selecciona "Todos los días" o un mes completo para ver la serie diaria.</div>'}</div>
      </div>`;
    }
    return html;
  }

  // ---------- detalle ----------
  function renderDetalle(){
    const units = scopedUnits();
    const dates = new Set(scopeDates());
    let rows = [];
    units.forEach(u=>{
      u.dias.filter(d=>dates.has(d.fecha)).forEach(d=>rows.push({u,d}));
    });
    rows.sort((a,b)=> b.d.fecha.localeCompare(a.d.fecha) || a.u.placa.localeCompare(b.u.placa));
    if(rows.length > 500){ rows = rows.filter(r=>r.d.movimiento).concat(rows.filter(r=>!r.d.movimiento)).slice(0,500); }
    const showUnitCol = true;
    const body = rows.map(({u,d})=>`
      <tr>
        <td>${fmtDate(d.fecha)}</td>
        ${showUnitCol?`<td class="plate">${u.placa}</td><td>${u.conductor}</td>`:''}
        <td class="num">${fmtNum(d.km,1)}</td>
        <td>${d.movimiento?`<span class="pill pill-good"><span class="dot"></span>Movimiento</span>`:`<span class="pill pill-critical"><span class="dot"></span>Sin movimiento</span>`}</td>
        <td class="mono">${fmtHora(d.hora_inicio)} – ${fmtHora(d.hora_fin)}</td>
        <td class="loc-text">${d.ciudad_inicial||'—'} &rarr; ${d.ciudad_final||'—'}</td>
      </tr>`).join('');
    return `<div class="panel">
      <div class="panel-title">Detalle diario</div>
      <div class="panel-sub">${rows.length} registro${rows.length===1?'':'s'}${rows.length>=500?' (mostrando los más relevantes)':''}</div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Fecha</th><th>Placa</th><th>Conductor</th><th class="num">Km</th><th>Estado</th><th>Horario</th><th>Ciudad inicio &rarr; fin</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;
  }

  // ---------- render ----------
  function render(){
    renderChips();
    renderMonthChips();
    renderTabs();
    document.getElementById('brand-sub').innerHTML = `<b>${DATA.meta.total_unidades}</b> unidades activas · periodo <b>${fmtDate(DATA.meta.periodo_inicio)} – ${fmtDate(DATA.meta.periodo_fin)}</b> · fuente: ${DATA.meta.fuente}`;
    renderKPIs();
    let html = '';
    if(state.tab==='resumen') html += renderResumen();
    else if(state.tab==='kilometraje') html += renderKilometraje();
    else html += renderDetalle();
    document.getElementById('content').innerHTML = html;

    document.querySelectorAll('.sm-card').forEach(el=>{
      el.addEventListener('click', ()=>{ state.units = [el.dataset.unit]; render(); });
    });
    const chartWrap = document.getElementById('chart-wrap');
    if(chartWrap) attachBarTooltip(chartWrap, false);
    const cmpWrap = document.getElementById('cmp-chart-wrap');
    if(cmpWrap) attachBarTooltip(cmpWrap, true);
    document.querySelectorAll('#kilometraje-charts .barchart-wrap').forEach(w=>attachBarTooltip(w,false));
  }

  render();

  document.getElementById('footer').innerHTML =
    `Datos GPS: matriz de rutas BioMar (${fmtDate(DATA.meta.periodo_inicio)} – ${fmtDate(DATA.meta.periodo_fin)}) · Generado ${fmtDateLong(DATA.meta.generado)} · Departamento de Monitoreo, Telearseg`;

  // ---------- POE (contenido nativo, sin PDF) ----------
  const POE_HTML = `
    <h4>Objetivo</h4>
    <p class="lead">Estandarizar la respuesta de monitoreo GPS ante cualquier evento de riesgo en ruta de la flota BioMar, con procedimiento único, roles claros y tiempos de reacción medibles.</p>
    <div class="code-row">
      <span><b>Código:</b> TLSG-POE-BIOMAR-GPS-01</span>
      <span><b>Versión:</b> 01</span>
      <span><b>Aplica a:</b> 28 unidades — flota BioMar</span>
      <span><b>Modelo base:</b> TLSG-POE-GPS-CENTRAL-01</span>
    </div>

    <div class="risk-row"><span class="pill pill-good"><span class="dot"></span>BAJO</span>
      <div class="risk-body"><b>Parada no autorizada &gt; 1 min</b> (tolerancia geocerca) → F1, llamada de verificación. Meta ≤3 min. Responsable: Operador GPS.</div></div>
    <div class="risk-row"><span class="pill pill-warn"><span class="dot"></span>MEDIO</span>
      <div class="risk-body"><b>Desvío de ruta no autorizado / pérdida temporal de señal</b> → F1+F2, verificación + aviso a Jefe Seguridad BioMar. Meta ≤5 min. Responsable: Operador → Jefe Monitoreo.</div></div>
    <div class="risk-row"><span class="pill pill-critical"><span class="dot"></span>ALTO</span>
      <div class="risk-body"><b>Botón de pánico / robo o asalto confirmado / sin respuesta tras 3 intentos</b> → F3, activación ECU911 + escalamiento total (F1–F4). Meta ≤5 min. Responsable: Jefe de Monitoreo.</div></div>
    <div class="risk-row"><span class="pill pill-critical"><span class="dot"></span>CRÍTICO</span>
      <div class="risk-body"><b>Indicios de secuestro / agresión con arma / pérdida total y simultánea GPS+celular</b> → Anexo Secuestro + Comité de Crisis BioMar–Telearseg. Meta: inmediato. Responsable: Jefe Monitoreo + Gerencia.</div></div>

    <h4>Código de verificación de seguridad</h4>
    <div class="table-scroll"><table>
      <tbody>
        <tr><td style="width:180px; color:var(--text-muted); font-weight:600;">Pregunta de monitoreo</td><td>"¿Todo en orden con la entrega/ruta de hoy, [nombre del conductor]?"</td></tr>
        <tr><td style="color:var(--text-muted); font-weight:600;">Respuesta segura</td><td>"Todo tranquilo, sigo en ruta" (o frase clave acordada con BioMar).</td></tr>
        <tr><td style="color:var(--text-muted); font-weight:600;">Respuesta de alerta</td><td>Respuesta fuera del código, nerviosismo evidente, o NO CONTESTAR tras 3 intentos en 5 min.</td></tr>

    </table></div>

      <tbody>
        <tr><td><b>F1</b> Detección</td><td>Identificar la alerta</td><td>Geocerca, botón de pánico, parada, pérdida de señal</td><td>Automático, al ocurrir</td><td>Operador GPS</td></tr>
        <tr><td><b>F2</b> Verificación</td><td>Confirmar condición real del conductor</td><td>Código de seguridad (máx. 3 intentos / 5 min)</td><td>Inmediatamente tras la alerta</td><td>Operador GPS</td></tr>
        <tr><td><b>F3</b> Clasificación</td><td>Asignar nivel de riesgo</td><td>Según matriz de niveles</td><td>Al concluir verificación</td><td>Operador / Jefe Monitoreo</td></tr>
        <tr><td><b>F4</b> Escalamiento</td><td>Notificar y/o activar autoridades</td><td>Jefe Seguridad BioMar → Jefe Monitoreo → ECU911 (911) → Gerencia</td><td>Según nivel (Medio/Alto/Crítico)</td><td>Jefe de Monitoreo</td></tr>

      </tbody>
    </table></div>

    <h4>Guía rápida por escenario</h4>
    <div class="table-scroll"><table class="scenario-table">
      <thead><tr><th>Escenario</th><th>Particularidad clave</th></tr></thead>
      <tbody>
        <tr><td>Desvío de ruta</td><td>Si no se identifica motivo en 3 intentos/5 min → escala a Robo/Asalto.</td></tr>
        <tr><td>Robo o asalto</td><td>Botón de pánico → confirmación inmediata, sin esperar verificación.</td></tr>
        <tr><td>Secuestro</td><td>No confrontar. Solicitar unidad GIR/DINASED al ECU911, no patrullaje regular.</td></tr>

        <tr><td>Incendio de la unidad</td><td>Evacuar y alejarse; no intentar rescatar carga.</td></tr>
        <tr><td>Sabotaje / vandalismo</td><td>Fotografiar sin mover evidencia; evaluar afectación a cadena de frío.</td></tr>
      </tbody>
    </table></div>

    <h4>Comunicación escalonada — contactos BioMar</h4>
    <div class="table-scroll"><table>

        <tr><td><b>F1</b></td><td>Conductor → Operador de Monitoreo GPS (Telearseg, Estación #0/#6)</td><td>Central de Monitoreo Telearseg</td></tr>

      </tbody>
    </table></div>

    <h4>Pasos a seguir</h4>
    <div class="poe-steps">
      <div class="poe-step">
        <div class="poe-step-title"><span class="check">&check;</span> F1 · Detección</div>
        <div class="poe-step-sub">Alerta en plataforma</div>
        <div class="field"><dt>Quién:</dt><dd>Operador de Monitoreo GPS</dd></div>

        <div class="field"><dt>Cuándo:</dt><dd>Automático, al ocurrir el disparador.</dd></div>

      </div>

      <div class="poe-step">
        <div class="poe-step-title"><span class="check">&check;</span> F4 · Comunicación</div>
        <div class="poe-step-sub">Avisar al responsable</div>
        <div class="field"><dt>Quién:</dt><dd>Jefe de Monitoreo</dd></div>
        <div class="field"><dt>Cómo:</dt><dd>Jefe de Monitoreo o Jefe de Seguridad BioMar — cualquiera de los dos.</dd></div>
        <div class="field"><dt>Cuándo:</dt><dd>En paralelo a la activación de ECU911.</dd></div>
        <div class="field"><dt>Por qué:</dt><dd>Mantiene informado al cliente para decisiones oportunas.</dd></div>
      </div>
      <div class="poe-step">
        <div class="poe-step-title"><span class="check">&check;</span> F5 · Cierre</div>
        <div class="poe-step-sub">Documentar el evento</div>
        <div class="field"><dt>Quién:</dt><dd>Jefe de Monitoreo</dd></div>
        <div class="field"><dt>Cómo:</dt><dd>Informe con línea de tiempo, evidencias y recomendaciones.</dd></div>
        <div class="field"><dt>Cuándo:</dt><dd>Al resolverse el evento.</dd></div>
        <div class="field"><dt>Por qué:</dt><dd>Garantiza trazabilidad y mejora continua.</dd></div>
      </div>
      <div class="poe-step">
        <div class="poe-step-title"><span class="check">&check;</span> Contactos clave</div>
        <div class="poe-step-sub">A quién llamar</div>

        <div class="field"><dt>Jefe Seguridad BioMar:</dt><dd>Ing. Dick Aguilar [teléfono a confirmar]</dd></div>
        <div class="field"><dt>Jefe de Monitoreo:</dt><dd>Telearseg — contacto interno</dd></div>
      </div>
    </div>
  `;

  const modalBackdrop = document.getElementById('modal-backdrop');

  const modalTitle = document.getElementById('modal-title');
  const modalSub = document.getElementById('modal-sub');
  const ICON_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5h6l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5A1.5 1.5 0 0 1 7.5 3.5H8z"/><path d="M14 3.5V8h4"/><path d="M9 12.5h6M9 15.5h6M9 9.5h2"/></svg>';
  const ICON_SHIELD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg>';

  function closeModal(){ modalBackdrop.classList.remove('open'); modalBody.classList.remove('pdf-body'); modalBody.innerHTML = ''; }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', (e)=>{ if(e.target===modalBackdrop) closeModal(); });

  document.getElementById('btn-poe').addEventListener('click', ()=>{
    modalIcon.innerHTML = ICON_DOC;
    modalTitle.textContent = 'Procedimiento Operativo Estándar (POE)';
    modalSub.textContent = 'Monitoreo GPS — Cliente BioMar (Alimentsa S.A.)';
    modalBody.classList.remove('pdf-body');
    modalBody.innerHTML = POE_HTML;
    modalBackdrop.classList.add('open');
  });
  document.getElementById('btn-protocolo').addEventListener('click', ()=>{
    modalIcon.innerHTML = ICON_SHIELD;
    modalTitle.textContent = 'Protocolo de Seguridad y Monitoreo GPS';
    modalSub.textContent = 'Monitoreo GPS — Cliente BioMar (Alimentsa S.A.)';
    modalBody.classList.add('pdf-body');
    modalBody.innerHTML = '<iframe src="Protocolo_Biomar_GPS.pdf" title="Protocolo de Seguridad y Monitoreo GPS"></iframe>';
    modalBackdrop.classList.add('open');
  });

  // ---------- data.json sync ----------
  (async function(){
    const syncDot = document.getElementById('sync-dot');
    const syncText = document.getElementById('sync-text');
    try{
      const resp = await fetch('./data.json', { cache: 'no-store' });
      if(!resp.ok) throw new Error('no data.json');
      const fresh = await resp.json();
      DATA = fresh;
      const newMonths = computeAllMonths(DATA.meta.fechas);
      allMonths.length = 0; newMonths.forEach(m=>allMonths.push(m));
      if(state.month !== 'ALL' && !allMonths.includes(state.month)) state.month = 'ALL';
      render();
      syncText.textContent = 'sincronizado · ' + fmtDateLong(DATA.meta.generado);
      syncDot.classList.remove('stale');
    } catch(e){
      syncText.textContent = 'datos incluidos en la página (no se pudo leer data.json)';
      syncDot.classList.add('stale');
    }
  })();
})();
</script>
